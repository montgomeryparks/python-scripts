name: Build and Release Toolboxes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so the tagger can read previous versions
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run toolbox build script
        run: python build_toolboxes.py

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Defaults to bumping the last digit (v1.0.0 -> v1.0.1)
          default_bump: patch 

      - name: Create a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Use the tag and changelog generated by the previous step
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: dist/*.pyt