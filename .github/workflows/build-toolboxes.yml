name: Build ArcGIS Pro Toolboxes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run toolbox build script
        run: python build_toolboxes.py

      - name: Upload compiled PYT files
        uses: actions/upload-artifact@v4
        with:
          name: compiled-toolboxes
          path: dist/*.pyt
          retention-days: 90